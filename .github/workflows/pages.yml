name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Regenerate the marketing site's drawings and product demo from the current app code,
      # so counts and labels on the site never fall behind the app.
      - run: npm run build:site
      # The app is built with relative asset paths and served under /app/, so it works both at
      # keganberg.github.io/Bergeron-Maps/app/ and, once the custom domain is on, bergeronmaps.com/app/.
      - run: npx vite build --base=./
        env:
          # Public project URL and anon key: safe to publish. Row-level security in
          # supabase/migrations decides what each signed-in person can reach.
          VITE_SUPABASE_URL: https://ysebxeokxpnmckwdtimj.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzZWJ4ZW9reHBubWNrd2R0aW1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NDU3OTEsImV4cCI6MjEwOTEyMTc5MX0._gioylYj_sf6pLy3o6riTL0n9Y-EVsu3VNzpeRXYQkY
      # Marketing site (site/) at the root, the app under /app/.
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          # Build inputs stay in the repo, not on the public site.
          rm -rf _site/src _site/build-drawings.py
          cp -r dist/. _site/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
